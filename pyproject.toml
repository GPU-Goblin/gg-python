[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpugoblin"
version = "0.1.0"
description = "Python client and PyTorch driver for GPU Goblin: describe a model, check it, train it on the grid"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = ["numpy>=1.24", "requests>=2.31"]

[project.urls]
Homepage = "https://github.com/GPU-Goblin/gg-python"
Documentation = "https://github.com/GPU-Goblin/gg-python/blob/main/docs/PYTHON.md"
Issues = "https://github.com/GPU-Goblin/gg-python/issues"

[project.optional-dependencies]
torch = ["torch>=2.4"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gpugoblin*"]
